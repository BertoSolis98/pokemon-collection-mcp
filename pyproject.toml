[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pokemon-collection-mcp"
version = "0.1.0"
description = "MCP server that lets Claude track a Pokémon TCG collection and its price history."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    # Pinned below 2.0: the 2.x SDK renamed FastMCP to MCPServer.
    "mcp>=1.26,<2",
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
pokemon-collection-mcp = "pokemon_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pokemon_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
